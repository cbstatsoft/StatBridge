[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "statbridge-qt"
version = "0.7.1"
description = "A Qt6 statistical workspace translating a documented subset of Stata syntax to Python"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
authors = [{name = "Connor Baird"}]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "tests/fixtures/PYREADSTAT_LICENSE"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Education", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Mathematics"]
dependencies = [
  "python-calamine>=0.3,<1", "odfpy>=1.4,<2", "h5py>=3.11,<4",
  "psutil>=5.9,<8", "xlrd>=2,<3", "openpyxl>=3.1,<4", "jinja2>=3.1,<4",
  "polars>=1.30,<2", "pyarrow>=18,<26",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "statsmodels>=0.14.4,<0.16", "linearmodels>=7,<8",
  "pyreadr>=0.5,<1", "pyreadstat>=1.3,<2", "PySide6>=6.7,<7", "matplotlib>=3.8,<4"
]
[project.optional-dependencies]
rdata = ["pyreadr>=0.5,<1"]
dev = ["pytest>=8", "build>=1", "setuptools>=77.0.3", "wheel>=0.45", "xlwt>=1.3,<2"]
terminal = ["windows-curses>=2.4,<3; sys_platform == 'win32'"]
[project.scripts]
statbridge = "statbridge.__main__:main"
[project.gui-scripts]
statbridge-gui = "statbridge.ui:main"
[tool.setuptools.packages.find]
include = ["statbridge*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
statbridge = ["sample_data/*.csv", "legal/*"]
